<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #f2f2f2;
            font-family: "Roboto Mono", monospace;
        }
        form {
            background-color: #e6e6e7;
            padding: 16px;
            border: 1px solid #730be9;
            width: 28%;
            margin: auto;
        } 
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>

</head>
<body>
     <!-- form with text input, password input, radio buttons, checkboxes, and a submit button -->
<form>
    <label for="full name"> Name:</label><br>
    <input type="text"  required id="full name" name="full name" placeholder="Jane doe"><br><br>
    
    <button type="submit">Submit</button>

    <label for="email">Email:</label><br>
    <input type="email" required id="email" name="email" placeholder="jane.doe@example.com"><br><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" placeholder="**************"><br><br>

    <label for="weight">Weight:</label><br>
    <input type="number" min="30" max="250" step="0.1" required id="weight" name="weight" placeholder="weight in Kg"><br><br>

    <label for="dob">date of birth:</label><br>
    <input type="date" min="1940-01-01" max="2023-12-31" id="dob" name="dob"><br><br>
    
    <!-- name must be the same for radio buttons -->
     <input type="radio" id="m" name="gender" value="male">
    <label for="m">Male</label><br>

    <input type="radio" id="f" name="gender" value="female">
    <label for="f">Female</label><br>

    <hr>

    <input type="checkbox" id="vehicle1" name="vehicle1" value="Bike">
    <label for="vehicle1"> I have a bike</label><br>

    <br>
    <select>
        <option value="volvo">Volvo</option>
        <option value="saab">Saab</option>
        <option value="mercedes">Mercedes</option>
        <option value="audi">Audi</option>
        <option value="bmw">BMW</option>
    </select>

    <button type="register">Register</button>
</form>
    
</body>
</html>

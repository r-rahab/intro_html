<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list</title>

</head>
<body>
    <!-- unordered list -->
    <ul>
        <li>London</li>
        <li>Paris</li>
        <li>Tokyo</li>
         
    
    </ul>
    <!-- ordered list -->
    <ol type="a">
        <li>London</li>
        <li>Paris</li>
        <li>Tokyo</li>
</body>
</html>
